<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="752" height="577" viewBox="0 0 752 577" role="img" aria-label="Topology: Small Office / Home Office Network">
<title>Topology: Small Office / Home Office Network</title>
<style>
svg{color-scheme:light dark}
.bg{fill:Canvas}
